sentence=Professional TPMS (tire pressure) receiver for ESP32 / ESP32-S3 + CC1101 at 433.92 MHz.
paragraph=Unified fork of rtl_433_ESP trimmed to 25 FSK TPMS decoders, with configurable pins, decoder priorities, SPI locking, gap retention, CC1101 sensitivity tuning, frequency/bandwidth control and radio health recovery. Includes complete firmware examples for the R3 (ESP32-S3) and DEV (ESP32) devices.
category=Communication
