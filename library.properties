architectures=esp32
includes=TPMS_RTL433.h
depends=RadioLib (>=7.7.1), ArduinoJson (>=7.0.0), Adafruit GFX Library, Adafruit ST7735 and ST7789 Library, RTClib, LovyanGFX (>=1.2.0)
